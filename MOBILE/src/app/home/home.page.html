<!-- Sidebar Drawer Component -->
<app-sidebar-drawer
  [isSidebarOpen]="isSidebarOpen"
  [selectedTab]="selectedTab"
  (closeSidebarEvent)="closeSidebar()"
  (selectTabEvent)="openTabFromSidebar($event)"
  (logoutEvent)="onLogout()">
</app-sidebar-drawer>

<!-- Top Header Toolbar -->
<ion-header class="ion-no-border">
  <ion-toolbar style="padding: 6px 12px;">
    <div slot="start" style="display: flex; align-items: center; gap: 12px;">
      <!-- Tombol Hamburger Garis 3 Pojok Kiri Atas -->
      <div (click)="toggleSidebar()" title="Buka Menu Sidebar"
        style="width: 40px; height: 40px; border-radius: 14px; background: #EEF2FF; color: #4F46E5; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; box-shadow: 0 2px 10px rgba(79, 70, 229, 0.15); transition: all 0.2s ease;">
        <i class="fa-solid fa-bars"></i>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 0.98rem; color: #0F172A; letter-spacing: -0.02em;">
          {{ getTabTitle() }}
        </div>
        <div style="font-size: 0.7rem; font-weight: 800; color: #4F46E5; display: flex; align-items: center; gap: 4px;">
          <i class="fa-solid fa-sparkles"></i> Lost Talent Detector
        </div>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--padding-bottom: 90px;">
  <!-- VIEW UNTUK ROLE GURU -->
  <div *ngIf="userRole === 'guru'">
    <app-guru-view
      [selectedTab]="selectedTab"
      [userName]="userName"
      [teacherInfo]="teacherInfo"
      [teacherStudents]="teacherStudents"
      [isLoadingRoleData]="isLoadingRoleData">
    </app-guru-view>
  </div>

  <!-- VIEW UNTUK ROLE INSTITUSI -->
  <div *ngIf="userRole === 'institusi'">
    <app-institusi-view
      [selectedTab]="selectedTab"
      [userName]="userName"
      [institutionInfo]="institutionInfo"
      [institutionStats]="institutionStats"
      [institutionTeachers]="institutionTeachers"
      [isLoadingRoleData]="isLoadingRoleData">
    </app-institusi-view>
  </div>

  <!-- VIEW UNTUK ROLE SISWA / MAHASISWA / UMUM -->
  <div *ngIf="isStudentRole()">
    <div *ngIf="isLoadingDashboard" class="ion-text-center ion-padding" style="margin-top: 60px;">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p style="font-size: 0.85rem; color: #78716C; margin-top: 10px;">Memuat data dashboard...</p>
    </div>

    <div *ngIf="!isLoadingDashboard && dashboardError" class="ion-padding ion-text-center"
      style="margin-top: 40px; background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 16px;">
      <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.2rem; color: #DC2626; margin-bottom: 12px;"></i>
      <h3 style="font-weight: 800; color: #991B1B; margin: 0 0 6px 0;">Gagal Memuat Data</h3>
      <p style="font-size: 0.82rem; color: #7F1D1D; margin: 0 0 16px 0; line-height: 1.4;">{{ dashboardError }}</p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <ion-button color="primary" size="small" (click)="loadDashboardData()" style="font-weight: 700;">
          <i class="fa-solid fa-rotate-right" style="margin-right: 6px;"></i> Coba Lagi
        </ion-button>
        <ion-button color="danger" fill="outline" size="small" (click)="onLogout()" style="font-weight: 700;">
          Login Ulang
        </ion-button>
      </div>
    </div>

    <div *ngIf="!isLoadingDashboard && student">
      <!-- TAB BERANDA SISWA -->
      <app-student-home-tab
        *ngIf="selectedTab === 'home'"
        [student]="student"
        [testResult]="testResult"
        [grades]="grades"
        [achievements]="achievements"
        [aiAnalysis]="aiAnalysis"
        [teachers]="teachers"
        (selectTabEvent)="selectTab($event)">
      </app-student-home-tab>

      <!-- TAB PROFIL SISWA -->
      <app-student-profile-tab
        *ngIf="selectedTab === 'profile'"
        [selectedTab]="selectedTab"
        [student]="student"
        (saveAccountProfileEvent)="onSaveAccountProfile($event)"
        (deleteAvatarEvent)="onDeleteAvatar()">
      </app-student-profile-tab>

      <!-- TAB NILAI RAPOR SISWA -->
      <app-student-grades-tab
        *ngIf="selectedTab === 'grades'"
        [selectedTab]="selectedTab"
        [grades]="grades"
        [isSelectingGrades]="isSelectingGrades"
        [selectedGrades]="selectedGrades"
        [student]="student"
        [userRole]="userRole"
        [newGrade]="newGrade"
        (toggleGradeSelectionModeEvent)="toggleGradeSelectionMode()"
        (toggleSelectGradeEvent)="toggleSelectGrade($event)"
        (deleteSelectedGradesEvent)="onDeleteSelectedGrades()"
        (deleteAllGradesEvent)="onDeleteAllGrades()"
        (deleteGradeEvent)="onDeleteGrade($event)"
        (submitIndependentGradeEvent)="onSubmitIndependentGrade()">
      </app-student-grades-tab>

      <!-- TAB PRESTASI SISWA -->
      <app-student-achievements-tab
        *ngIf="selectedTab === 'achievements'"
        [selectedTab]="selectedTab"
        [achievements]="achievements"
        [isSelectingCerts]="isSelectingCerts"
        [selectedCerts]="selectedCerts"
        [student]="student"
        [selectedFileName]="selectedFileName"
        [serverUrl]="serverUrl"
        [newAchievement]="newAchievement"
        (toggleCertSelectionModeEvent)="toggleCertSelectionMode()"
        (toggleSelectCertEvent)="toggleSelectCert($event)"
        (deleteSelectedCertsEvent)="onDeleteSelectedCerts()"
        (deleteAllCertsEvent)="onDeleteAllCerts()"
        (deleteAchievementEvent)="onDeleteAchievement($event)"
        (fileSelectedEvent)="onFileSelected($event)"
        (submitAchievementEvent)="onSubmitAchievement()">
      </app-student-achievements-tab>

      <!-- TAB TES RIASEC & AI SISWA -->
      <app-student-talent-tab
        *ngIf="selectedTab === 'talent'"
        [selectedTab]="selectedTab"
        [talentSubTab]="talentSubTab"
        [profileData]="profileData"
        [riasecTest]="riasecTest"
        [riasecAnswers]="riasecAnswers"
        [isAnalyzingAi]="isAnalyzingAi"
        [aiAnalysis]="aiAnalysis"
        (setTalentSubTabEvent)="talentSubTab = $event"
        (updateProfileEvent)="onUpdateProfile()"
        (submitRiasecTestEvent)="onSubmitRiasecTest()"
        (resetRiasecTestEvent)="onResetRiasecTest()"
        (runAiAnalysisEvent)="onRunAiAnalysis()"
        (resetAiAnalysisEvent)="onResetAiAnalysis()">
      </app-student-talent-tab>
    </div>
  </div>

  <!-- VIEW TAB PAPAN INFORMASI (SHARED FOR ALL ROLES) -->
  <app-info-board-tab
    *ngIf="selectedTab === 'info'"
    [selectedTab]="selectedTab"
    [announcements]="announcements"
    [announcementFilter]="announcementFilter"
    [isLoadingAnnouncements]="isLoadingAnnouncements"
    [filteredAnnouncements]="getFilteredAnnouncements()"
    (filterCategoryEvent)="announcementFilter = $event"
    (loadAnnouncementsEvent)="loadAnnouncements()">
  </app-info-board-tab>
</ion-content>

<!-- Floating Bottom Tab Bar Navigation -->
<ion-footer *ngIf="isStudentRole()" slot="bottom" class="ion-no-border">
  <ion-tab-bar>
    <ion-tab-button (click)="selectTab('home')" [selected]="selectedTab === 'home'">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Beranda</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="selectTab('grades')" [selected]="selectedTab === 'grades'">
      <ion-icon name="school-outline"></ion-icon>
      <ion-label>Nilai</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="selectTab('achievements')" [selected]="selectedTab === 'achievements'">
      <ion-icon name="trophy-outline"></ion-icon>
      <ion-label>Prestasi</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="selectTab('talent')" [selected]="selectedTab === 'talent'">
      <ion-icon name="sparkles-outline"></ion-icon>
      <ion-label>Analisa</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
