<!-- TAB PROFIL SISWA -->
<div *ngIf="selectedTab === 'profile'">
  <ion-card style="padding: 12px 16px;">
    <ion-card-content style="padding: 4px;">
      <div style="font-size: 1rem; font-weight: 800; color: #1C1917; margin-bottom: 12px;">Profil Pengguna</div>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem;">
        <div
          style="display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid #E8E5DC;">
          <span style="color: #78716C;">Nama</span>
          <span style="font-weight: 800; color: #1C1917;">{{ student.user?.name }}</span>
        </div>
        <div
          style="display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid #E8E5DC;">
          <span style="color: #78716C;">Email</span>
          <span style="font-weight: 700; color: #1C1917;">{{ student.user?.email }}</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #78716C;">Institusi</span>
          <span style="font-weight: 700; color: #1C1917;">{{ student.institution?.name || 'Mandiri' }}</span>
        </div>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-card class="card-sand">
    <ion-card-header style="padding: 14px 16px;">
      <ion-card-title style="font-size: 1.1rem;">Update Minat & Hobi</ion-card-title>
    </ion-card-header>
    <ion-card-content style="padding: 0 16px 16px 16px;">
      <form (ngSubmit)="onUpdateProfile()">
        <ion-item style="--border-radius: 12px; margin-bottom: 10px;">
          <ion-label position="stacked">Hobi</ion-label>
          <ion-input type="text" name="hobbies" [(ngModel)]="profileData.hobbies"
            placeholder="Coding, Design"></ion-input>
        </ion-item>
        <ion-item style="--border-radius: 12px; margin-bottom: 14px;">
          <ion-label position="stacked">Minat</ion-label>
          <ion-input type="text" name="interests" [(ngModel)]="profileData.interests"
            placeholder="AI, Web Dev"></ion-input>
        </ion-item>
        <ion-button expand="block" color="primary" class="ion-margin-top" type="submit" style="font-weight: 800; --border-radius: 14px; height: 46px;">
          Simpan Profil
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</div>
