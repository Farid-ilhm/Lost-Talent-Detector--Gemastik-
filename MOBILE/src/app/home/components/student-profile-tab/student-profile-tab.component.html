<!-- TAB PROFIL SISWA -->
<div *ngIf="selectedTab === 'profile'">
  <form *ngIf="student && student.user" (ngSubmit)="onSaveAccountProfile()">
    <ion-card style="padding: 12px 16px; border-radius: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.04);">
      <ion-card-content style="padding: 4px;">
        <div style="font-size: 1rem; font-weight: 800; color: #1C1917; margin-bottom: 16px;">Profil Pengguna</div>
        <div style="display: flex; flex-direction: column; gap: 14px;">
          
          <ion-item fill="outline" style="--border-radius: 12px; --background: #FFFFFF;">
            <ion-label position="stacked" style="color: #78716C; font-weight: 600;">Nama</ion-label>
            <ion-input type="text" name="name" [(ngModel)]="student.user.name" required style="font-weight: 700; color: #1C1917;"></ion-input>
          </ion-item>

          <ion-item fill="outline" style="--border-radius: 12px; --background: #FFFFFF;">
            <ion-label position="stacked" style="color: #78716C; font-weight: 600;">Email</ion-label>
            <ion-input type="email" name="email" [(ngModel)]="student.user.email" required style="font-weight: 700; color: #1C1917;"></ion-input>
          </ion-item>

          <ion-item fill="outline" [disabled]="true" style="--border-radius: 12px; --background: #F5F5F4; opacity: 0.85;">
            <ion-label position="stacked" style="color: #78716C; font-weight: 600;">Institusi</ion-label>
            <ion-input type="text" [value]="student.institution?.name || 'Mandiri'" [readonly]="true" style="font-weight: 700; color: #78716C;"></ion-input>
          </ion-item>

        </div>

        <ion-button expand="block" color="primary" class="ion-margin-top" type="submit" style="font-weight: 800; --border-radius: 14px; height: 46px; margin-top: 20px;">
          Simpan Profil
        </ion-button>
      </ion-card-content>
    </ion-card>
  </form>
</div>
