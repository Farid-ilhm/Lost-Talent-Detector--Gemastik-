<!-- Sidebar Drawer Backdrop -->
<div class="sidebar-backdrop" [class.active]="isSidebarOpen" (click)="closeSidebar()"></div>

<!-- Sidebar Drawer Panel -->
<div class="sidebar-drawer" [class.open]="isSidebarOpen">
  <div class="sidebar-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="assets/icon.png" alt="Lost Talent Logo" style="width: 36px; height: 36px; border-radius: 12px; object-fit: cover;">
      <div>
        <div style="font-weight: 800; font-size: 0.95rem; color: #0F172A;">Lost Talent</div>
        <div style="font-size: 0.7rem; font-weight: 700; color: #4F46E5;">Menu Utama App</div>
      </div>
    </div>
    <button (click)="closeSidebar()" style="border: none; background: #F1F5F9; color: #64748B; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; cursor: pointer;">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="sidebar-content">
    <!-- Profil -->
    <div class="sidebar-item" [class.active]="selectedTab === 'profile'" (click)="openTabFromSidebar('profile')">
      <i class="fa-solid fa-user" style="color: #10B981;"></i>
      <span>Profil</span>
    </div>

    <!-- Papan Informasi & Pengumuman -->
    <div class="sidebar-item" [class.active]="selectedTab === 'info'" (click)="openTabFromSidebar('info')">
      <i class="fa-solid fa-bullhorn" style="color: #6366F1;"></i>
      <span>Papan Informasi</span>
    </div>

    <!-- Beranda Utama -->
    <div class="sidebar-item" [class.active]="selectedTab === 'home'" (click)="openTabFromSidebar('home')">
      <i class="fa-solid fa-border-all"></i>
      <span>Beranda Utama</span>
    </div>
  </div>

  <div class="sidebar-footer">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <span style="font-weight: 600; color: #64748B;">Detector Gemastik</span>
      <span style="background: #F1F5F9; padding: 2px 6px; border-radius: 6px; font-weight: 700;">v1.0</span>
    </div>
    <button (click)="onLogout()" style="width: 100%; border: none; background: #FEE2E2; color: #DC2626; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar Sistem
    </button>
  </div>
</div>
